<div id="result"></div>
<script>
    function circle(radius, numberOfPoints) {
        const points = [];

        for (let i = 0; i < numberOfPoints; i++) {
            const theta = (i * 2 * Math.PI) / numberOfPoints;

            points.push({
                x: radius * Math.cos(theta),
                y: radius * Math.sin(theta)
            });
        }

        return points;
    }
